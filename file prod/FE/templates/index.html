<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halofromdocker</title>
    <style>
        :root {
            --accent: #fbd38d;
            --error: #ff6b6b;
            --glass: rgba(255, 255, 255, 0.1);
            --gradient: linear-gradient(135deg, #0f172a 0%, #334155 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        body > div {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            width: 320px;
            gap: 15px; /* Tightened gap for error placement */
            text-align: center;
            transition: all 0.4s ease;
        }

        span {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        input[type="text"] {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        /* Error message style */
        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: -10px; /* Pulls it closer to the text box */
            text-align: left;
            padding-left: 5px;
            animation: shake 0.3s ease;
        }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div id="container">
        <span>Daftarin Nama</span>
        <input type="text" id="nameInput" placeholder="Ketik nama di sini...">
        <button id="submitBtn">Daftar</button>
    </div>

<script>
    const container = document.getElementById('container');
    const btn = document.getElementById('submitBtn');
    const input = document.getElementById('nameInput');
    const api_url = "{{BE_addr}}"

    btn.addEventListener('click', async () => {
        // Remove existing error if any
        const oldError = document.querySelector('.error-msg');
        if (oldError) oldError.remove();

        const nameValue = input.value.trim();
        if (!nameValue) return;

        try {
            const response = await fetch(api_url + '/addname', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ "nama": nameValue })
            });

            const data = await response.json();

            if (response.ok) {
                // Success: Switch to Greeting
                showHelloPage(nameValue);
            } else {
                // Error (4xx, 5xx): Inject error message right under input
                const errorLabel = document.createElement('p');
                errorLabel.className = 'error-msg';
                errorLabel.innerText = data.msg || "Terjadi kesalahan";
                
                // Insert after the input box
                input.insertAdjacentElement('afterend', errorLabel);
                input.style.borderColor = 'var(--error)';
            }
        } catch (error) {
            console.error("Connection failed.");
        }
    });

    function showHelloPage(name) {
        container.style.opacity = '0';
        setTimeout(() => {
            container.innerHTML = `
                <span style="animation: fadeIn 0.5s;">Hello,</span>
                <h1 style="color: white; margin: 0; font-size: 2.5rem; animation: fadeIn 0.7s;">${name}</h1>
                <button onclick="location.reload()" style="margin-top: 20px; background: transparent; border: 1px solid var(--accent); color: var(--accent);">Kembali</button>
            `;
            container.style.opacity = '1';
        }, 400);
    }
</script>
</body>
</html>
